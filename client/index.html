      Font strategy:
        Display headings → Cormorant Garamond (editorial serif)
        Body / UI        → Inter (clean, legible sans-serif)
        Arabic           → Cairo (elegant Arabic typeface)
      font-display=swap prevents invisible text during load.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"

    />
